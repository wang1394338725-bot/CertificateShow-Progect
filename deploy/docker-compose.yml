# 奖状管理系统部署编排：mysql + backend + nginx 三个容器一个内网，只有 nginx 对外开 80
# 首次使用：复制 .env.example 为 .env 并填入真实密码/密钥，然后 docker compose up -d --build
services:
  mysql:
    image: mysql:8.0
    container_name: cert-mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
      MYSQL_DATABASE: certificate_management
      TZ: Asia/Shanghai
    # 2G 内存机器必须调小 buffer pool；init.sql 挂载后仅在数据卷为空（首次启动）时自动建表
    command: --innodb-buffer-pool-size=128M --performance-schema=off
    volumes:
      - mysql-data:/var/lib/mysql
      - ./sql/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p${DB_PASSWORD}"]
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped

  backend:
    build: ./backend          # backend/Dockerfile + app.jar（本地 mvn package 后上传）
    container_name: cert-backend
    environment:
      TZ: Asia/Shanghai
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/certificate_management?useUnicode=true&characterEncoding=utf-8&useSSL=false&serverTimezone=Asia/Shanghai
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      UPLOAD_BASE_PATH: /data/uploads
    volumes:
      - ./uploads:/data/uploads
    depends_on:
      mysql:
        condition: service_healthy
    mem_limit: 700m           # 双保险：ENTRYPOINT 已限 JVM 堆 512m
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    container_name: cert-nginx
    ports:
      - "80:80"               # 唯一对外端口；数据库和后端都不暴露
    volumes:
      - ./dist:/usr/share/nginx/html:ro          # 前端构建产物
      - ./uploads:/data/uploads:ro               # 与 backend 共享图片目录（nginx 只读直出）
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  mysql-data:
