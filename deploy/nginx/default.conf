# Nginx 反代 + 静态托管 + 防刷限流 + HTTPS（acme.sh 自动续期）
# 注意：limit_req_zone / limit_conn_zone 必须写在 server 块外（本文件顶层即 http 上下文）

# ---- 防刷限流（按量流量计费，限流是刚性需求）----
# 每 IP：接口 10 次/秒（burst 20 突发），图片 5 次/秒（单张大，限更严）
limit_req_zone  $binary_remote_addr  zone=api:10m  rate=10r/s;
limit_req_zone  $binary_remote_addr  zone=img:10m  rate=5r/s;
limit_conn_zone $binary_remote_addr  zone=perip:10m;

# ---- HTTP 全部 301 跳 HTTPS（裸 IP 访问也重定向到主域，顺便统一 canonical）----
server {
    listen 80 default_server;
    server_name _;
    return 301 https://starcurtainone.cn$request_uri;
}

# ---- HTTPS 主站：acme.sh 用 DNS 验证（dns_ali）签发，不占端口、续期全自动 ----
server {
    listen 443 ssl http2;
    server_name starcurtainone.cn www.starcurtainone.cn;

    # 证书由 acme.sh --install-cert 安装到宿主机 /opt/cert/certs（compose 只读挂载进来）
    ssl_certificate     /etc/nginx/certs/starcurtainone.cn.pem;
    ssl_certificate_key /etc/nginx/certs/starcurtainone.cn.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:2m;
    ssl_session_timeout 1h;

    # 上传走 /api 反代，必须放开请求体上限，否则传图直接 413
    client_max_body_size 20m;

    # JSON 压缩：出口流量降到约 1/5~1/10（按量流量下省钱）
    gzip on;
    gzip_types application/json text/css application/javascript;
    gzip_min_length 1k;

    # ---- 前端 SPA ----
    root /usr/share/nginx/html;
    index index.html;

    # Vite 构建的带哈希资源：内容永不变，一年 immutable 缓存
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # 入口页不缓存：发新版后用户立刻拿到新页面
    location = /index.html {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;   # history 路由刷新兜底
    }

    # ---- API 反代：末尾斜杠负责去掉 /api 前缀（等价于 dev 时 Vite proxy 的 rewrite）----
    location /api/ {
        limit_req  zone=api  burst=20 nodelay;
        limit_conn perip 10;
        limit_req_status 429;

        proxy_pass http://backend:9090/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 60s;
    }

    # ---- 图片直出：挂载卷直接读盘，不进 JVM；限流 + 长缓存 ----
    location /uploads/ {
        limit_req  zone=img  burst=10 nodelay;
        limit_conn perip 5;
        limit_req_status 429;

        alias /data/uploads/;
        add_header Cache-Control "public, max-age=604800, immutable";
    }
}
